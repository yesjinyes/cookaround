<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>레시피 목록</title>
    <link rel="stylesheet" href="/css/recipe/list.css">
    <link rel="stylesheet" href="/css/common/header.css">
</head>
<body>
    <div th:replace="~{common/header :: header}"></div>

    <div id="container">
        <h1>레시피</h1>

        <!-- 카테고리 -->
        <div id="category-container">
            <a href="#" class="category-link active" data-category="ALL">전체  </a> |
            <a href="#" class="category-link" data-category="KOREAN">한식</a> |
            <a href="#" class="category-link" data-category="WESTERN">양식</a> |
            <a href="#" class="category-link" data-category="JAPANESE">일식</a> |
            <a href="#" class="category-link" data-category="CHINESE">중식</a> |
            <a href="#" class="category-link" data-category="DESSERT">디저트</a> |
            <a href="#" class="category-link" data-category="OTHER">기타</a>
        </div>

        <!-- 레시피 등록 -->
        <div id="btn-container">
            <button sec:authorize="isAuthenticated()" onclick="location.href='/recipe/new'">레시피 등록</button>
        </div>

        <!-- 정렬 -->
        <div id="sort-container">
            <a href="#" class="sort-content active" data-sort="newest" id="sort-newest">최신순</a>
            <a href="#" class="sort-content" data-sort="views" id="sort-views">조회순</a>
            <a href="#" class="sort-content" data-sort="reviews" id="sort-reviews">후기많은순</a>
        </div>
        <br>

        <section class="recipe-list" id="recipe-list">
            <div id="card-container">
                <!-- 카드 append 자리 -->
            </div>
        </section>

        <!-- 페이징 -->
        <section class="page-bar text-center mt-4">
            <!-- JS에서 페이지 버튼이 자동 생성됨 -->
        </section>

        <!-- 카드 템플릿 -->
        <script type="text/template" id="recipe-list-template">
            <div class="recipe-card">
                <img class="card-img" alt="">
                <div class="card-title"></div>
                <div class="review-info">
                    <div class="member-info">
                        <img class="card-profile" alt="">
                        <span class="card-loginId"></span>
                    </div>
                    <img class="img-heart" src="/img/heart_empty.png" alt="">
                </div>
            </div>
        </script>
    </div>

    <!-- JS 연결 -->
    <script src="/js/recipe/list.js"></script>
</body>
</html>
