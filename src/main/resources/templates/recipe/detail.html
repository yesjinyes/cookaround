<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>레시피 상세</title>
    <link rel="stylesheet" href="/css/recipe/detail.css">
    <link rel="stylesheet" href="/css/common/header.css">
</head>
<body>
<div th:replace="~{common/header :: header}"></div>

<div id="container">
    <!-- 레시피 헤더 -->
    <div class="recipe-header">
        <h1 id="recipe-title"></h1>
        <div class="recipe-meta">
            <span class="category" id="recipe-category"></span>
            <span class="view-count">조회수:<span id="recipe-viewCount"></span></span>
            <span class="created-date" id="recipe-createdAt">0</span>
        </div>
    </div>

    <!-- 작성자 정보 -->
    <div class="author-info">
        <img id="author-profile" src="" alt="프로필" class="author-profile">
        <span class="author-name" id="author-name"></span>
    </div>



    <!-- 레시피 기본 정보 -->
    <div class="recipe-info">
        <div class="info-item">
            <span class="label">난이도:</span>
            <span class="value" id="recipe-difficulty">-</span>
        </div>
        <div class="info-item">
            <span class="label">조리시간:</span>
            <span class="value" id="recipe-cookingTime">-</span>
        </div>
        <div class="info-item">
            <span class="label">인분:</span>
            <span class="value" id="recipe-serving">-</span>
        </div>
    </div>

    <!-- 레시피 설명 -->
    <div class="recipe-description">
        <h3>레시피 소개</h3>
        <p id="recipe-description">레시피 내용을 입력하세요</p>
    </div>

    <!-- 재료 섹션 -->
    <div class="recipe-ingredients">
        <h3>재료</h3>
        <div id="ingredient-list"></div>
    </div>

    <!-- 조리 순서 -->
    <div class="recipe-steps">
        <h3>조리 순서</h3>
        <div id="step-list"></div>
    </div>

    <!-- 버튼 영역 -->
    <div class="btn-container">
        <button class="btn btn-secondary" onclick="location.href='/recipe/list'">목록으로</button>
        <button class="btn btn-primary" id="btn-like">좋아요</button>
    </div>

    <!-- 후기 섹션 -->
    <div class="recipe-reviews">
        <h3>후기 (<span id="review-count">0</span>)</h3>
        <div id="review-list"></div>
    </div>
</div>

<script src="/js/recipe/detail.js"></script>
</body>
</html>
